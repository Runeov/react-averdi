<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workforce Banner</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        // Extracted from your geometric branding
                        brand: {
                            red: '#D42B2B',
                            blue: '#1E4B94',
                            yellow: '#F4C430',
                            green: '#2E8B57',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <section class="relative w-full max-w-5xl mx-auto rounded-2xl overflow-hidden shadow-2xl h-[550px] flex flex-col items-center justify-center text-center group">
        
        <div class="absolute inset-0 bg-cover bg-center bg-no-repeat transition-transform duration-700 group-hover:scale-105"
             style="background-image: url('3e3c9b4e-6ee0-40fd-ac86-90c2684b587c.avif');">
        </div>
        
        <div class="absolute inset-0 bg-black/70 z-10"></div>

        <div class="relative z-20 px-6 flex flex-col items-center max-w-4xl">
            
            <h1 class="text-3xl md:text-5xl font-semibold text-white tracking-tight leading-tight drop-shadow-md">
                Empower Your Sales & Marketing with a Next-Gen AI Workforce
            </h1>

            <div class="h-1.5 w-48 my-8 rounded-full bg-gradient-to-r from-brand-blue via-brand-red to-brand-yellow shadow-lg"></div>

            <p class="text-base md:text-lg text-gray-100 max-w-2xl mb-10 leading-relaxed font-light drop-shadow-sm">
                Leverage AI Agents for real-time calling and unified multi-channel engagement, optimizing customer interactions at scale.
            </p>

            <button class="px-10 py-4 bg-brand-red text-white font-bold rounded-full transition-all duration-300 hover:bg-brand-blue hover:scale-105 hover:shadow-[0_0_20px_rgba(30,75,148,0.6)] ring-2 ring-white/20 shadow-xl">
                Get Started
            </button>
        </div>
    </section>
    </body>
</html>
